[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eurosat-cnn"
version = "1.0.0"
description = "Land-use classification of EuroSAT satellite images with convolutional neural networks (TensorFlow/Keras)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Sabry Eldeeb" }]
dependencies = [
    "tensorflow>=2.16,<2.18",
    "keras>=3.3",
    "numpy<2",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebooks = ["jupyter", "ipykernel"]
presentation = ["python-pptx>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
